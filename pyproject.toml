[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alarm-cli"
version = "1.0.0"
description = "A terminal-based alarm clock application"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.2"]

[project.scripts]
alarm = "alarm_cli.cli:main"

[tool.setuptools.packages.find]
include = ["alarm_cli*"]
